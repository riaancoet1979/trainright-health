name: Garmin sync validation (private)

# SECURITY: Garmin health JSON must never be uploaded to GitHub Pages or an
# Actions artifact. TrainRight's protected Windows sync owns the live Garmin
# payload until the authenticated private sync backend supports health records.
# This manual workflow only verifies that the importer can build a payload; the
# runner is destroyed after completion and no payload is uploaded.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-private-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked private Garmin material
        run: |
          if git ls-files | grep -Ei '(^|/)(gh-sync\.json|garmin_health\.json)$|(^|/)\.garmin_tokens/|garmin.*token'; then
            echo "::error::Private Garmin data or tokens are tracked"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install garminconnect
        run: pip install --quiet garminconnect

      - name: Restore Garmin tokens from encrypted secret
        env:
          GARMIN_TOKENS_B64: ${{ secrets.GARMIN_TOKENS_B64 }}
        run: |
          test -n "$GARMIN_TOKENS_B64" || { echo "::error::GARMIN_TOKENS_B64 is not set"; exit 1; }
          mkdir -p .garmin_tokens
          echo "$GARMIN_TOKENS_B64" | base64 -d | tar -xz -C .garmin_tokens

      - name: Validate private Garmin importer
        env:
          GARMIN_TOKEN_DIR: .garmin_tokens
        run: |
          python garmin_sync.py --public-only
          python - <<'PY'
          import json
          payload = json.load(open('public/gh-sync.json', encoding='utf-8'))
          assert payload.get('source') == 'garmin_connect'
          assert len(payload.get('days', {})) == 32
          print('Private Garmin importer validated for 32 days; payload will not be uploaded.')
          PY

      - name: Remove generated health payload
        if: always()
        run: rm -f public/gh-sync.json
